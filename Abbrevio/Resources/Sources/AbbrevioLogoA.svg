<!--
  Abbrevio "a" logo — editable source.

  Structure:
    - #letterform : the lowercase "a" mark. Outline traced from the Scoutie Sans
      typeface (https://fonts.google.com/specimen/Scoutie+Sans, by Tyler Finck),
      filled with the brand red gradient.
    - #sparkles   : the decorative sparkle accents. Delete or hide this group
      to get the "plain" variant used everywhere the mark is shown small
      (app icon, taskbar/tray, favicon, installer graphics) — at those sizes
      the sparkles are too small to read and were omitted from the baked
      assets for that reason. Keep them for anything shown larger (roughly
      400px+), such as a website hero image or splash screen.

  Colors are sampled from the CanScribe ribbon logo for palette continuity:
    bright highlight #ED4B58, mid #AE2C31 / #C23540, shadow #501818 / #3F1212.
-->

